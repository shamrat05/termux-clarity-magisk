# Termux Clarity — readable, calm defaults for small text.
# Reapply without closing sessions: termux-reload-settings

night-mode = true
terminal-margin-horizontal = 8
terminal-margin-vertical = 2
terminal-transcript-rows = 2000
terminal-cursor-style = bar
terminal-cursor-blink-rate = 700

extra-keys-style = arrows-all
extra-keys-text-all-caps = false
extra-keys = [['ESC','TAB','CTRL','ALT',{key: '-', popup: '|'},'HOME','END','KEYBOARD',{macro: "cd SPACE ~ SPACE && SPACE termux-menu\n", display: "MENU"}], \
             ['PGUP','PGDN','LEFT','DOWN','UP','RIGHT','DRAWER',{macro: "exit\n", display: "EXIT"}]]
